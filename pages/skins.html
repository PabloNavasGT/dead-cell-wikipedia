<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspectos y Skins - Dead Cells</title>
    <link rel="stylesheet" href="../css/especial.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <img src="../imagenes/verdadedo simblodeadcell.png" id="compañero-fijo2" alt="Compañero de viaje">
    
    <h1 class="titulo2">¡Qué aspecto tan bueno tienes hoy!</h1>
    <hr>

    <div id="contenedor-atuendos">
        <!-- Se inyectan los atuendos normales y colaborativos -->
    </div>

    <br> 
    <div class="seccion-brillante footer-bloque-video">
        <div class="footer-video-col">
            <video src="../video/WhatsApp Video 2026-02-04 at 12.02.33.mp4" autoplay loop muted></video>
        </div>
        <div class="footer-texto-col">
            <h2 class="titulo2" style="font-size: 1.3rem; margin-top: 0;">
               Aún tienes tantos estilos por modelar... así que ten paciencia
            </h2>
            <h2 style="margin-bottom: 0;">
                <a href="../index.html">Volver al lobby</a>
            </h2>
        </div>
    </div>

    <script>
        async function cargarSkins() {
            try {
                const resAtuendos = await fetch('/api/wiki/atuendos');
                const dataAtuendos = await resAtuendos.json();

                const resColab = await fetch('/api/wiki/atuendos-colaborativos');
                const dataColab = await resColab.json();

                const contenedor = document.getElementById('contenedor-atuendos');
                contenedor.innerHTML = '';

                // Atuendos normales (Clasificados por su rareza en .aspectos-basicos o .aspectos-avanzado)
                if(dataAtuendos.success) {
                    dataAtuendos.data.forEach(skin => {
                        let claseRareza = skin.rareza === 'basico' ? 'aspectos-basicos' : 'aspectos-avanzado';
                        contenedor.innerHTML += `
                            <div class="${claseRareza}">
                                <div class="info-text">
                                    <h2>${skin.nombre}</h2>
                                    <p>${skin.descripcion}</p>
                                    ${skin.dondeConseguirLo ? `<p><strong>Cómo conseguirlo:</strong> ${skin.dondeConseguirLo.descripcion}</p>` : ''}
                                    <p><em>${skin.extra}</em></p>
                                </div>
                                <img src="${skin.imagen}" alt="${skin.nombre}" width="150">
                            </div>
                        `;
                    });
                }

                // Atuendos Colaborativos (Usan la clase .aspectos-colaborativo con doble imagen)
                if(dataColab.success) {
                    dataColab.data.forEach(skin => {
                        contenedor.innerHTML += `
                            <div class="aspectos-colaborativo">
                                <div class="info-text">
                                    <h2>${skin.nombre}</h2>
                                    <p>${skin.descripcion}</p>
                                    <p><em>${skin.extra}</em></p>
                                </div>
                                <div class="imagenes-dobles">
                                    <img src="${skin.imagen}" alt="Imagen 1" class="img-especial-1" width="120">
                                    ${skin.imagenSecundaria ? `<img src="${skin.imagenSecundaria}" alt="Imagen 2" class="img-especial-2" width="120">` : ''}
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error("Error al cargar aspectos:", error);
            }
        }
        cargarSkins();
    </script>
</body>
</html>
