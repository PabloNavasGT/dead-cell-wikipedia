<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos y Mecánicas - Dead Cells</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <img src="../imagenes/verdadedo simblodeadcell.png" id="compañero-fijo" alt="Compañero de viaje">

    <h1 class="titulo2">Recursos y Mecánicas de la Isla</h1>
    <hr>

    <div id="grid-recursos">
        <!-- Se inyectarán dinámicamente desde la BD -->
    </div>

    <br>
    <div class="seccion-brillante footer-bloque-video">
        <div class="footer-video-col">
            <video src="../video/WhatsApp Video 2026-02-04 at 12.02.33.mp4" autoplay loop muted></video>
        </div>
        <div class="footer-texto-col">
            <h2 class="titulo2" style="font-size: 1.3rem; margin-top: 0;">
               Hay muchos objetos por recolectar... así que ten paciencia
            </h2>
            <h2 style="margin-bottom: 0;">
                <a href="../index.html">Volver al lobby</a>
            </h2>
        </div>
    </div>

    <script>
        async function cargarRecursos() {
            try {
                const res = await fetch('/api/wiki/recursos');
                const json = await res.json();
                const grid = document.getElementById('grid-recursos');
                grid.innerHTML = '';

                if(json.success && json.data) {
                    json.data.forEach(item => {
                        grid.innerHTML += `
                            <div class="${item.claseCss || 'recursos'}">
                                <img src="${item.imagen}" alt="${item.nombre}">
                                <div class="info-text">
                                    <h2>${item.nombre}</h2>
                                    <p>${item.descripcion}</p>
                                    ${item.extra ? `<p><em>${item.extra}</em></p>` : ''}
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error("Error al cargar recursos:", error);
            }
        }
        cargarRecursos();
    </script>
</body>
</html>
